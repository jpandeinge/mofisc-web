name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
          # Test environment variables (using dummy values for CI)
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_SUPABASE_URL: https://test.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: test-anon-key
          REACT_APP_FIREBASE_API_KEY: test-firebase-key
          REACT_APP_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: test-project
          REACT_APP_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          REACT_APP_FIREBASE_APP_ID: test-app-id
          REACT_APP_FIREBASE_VAPID_KEY: test-vapid-key

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Security regression tests
        run: npm run test:security

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          # Build with test/dummy values for CI validation
          REACT_APP_API_URL: https://api.example.com
          REACT_APP_SUPABASE_URL: https://test.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: test-anon-key
          REACT_APP_FIREBASE_API_KEY: test-firebase-key
          REACT_APP_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: test-project
          REACT_APP_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          REACT_APP_FIREBASE_APP_ID: test-app-id
          REACT_APP_FIREBASE_VAPID_KEY: test-vapid-key

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (development target)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          target: development
          tags: galahad-frontend:ci-dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          target: production
          tags: galahad-frontend:ci-prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=https://api.example.com
            REACT_APP_SUPABASE_URL=https://test.supabase.co
            REACT_APP_SUPABASE_ANON_KEY=test-anon-key

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [".", "remotion"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=low
